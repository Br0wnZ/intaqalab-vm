    branch: main
    strategy: depend
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
  variables:
    IMAGE_TAG: "1.0.${CI_PIPELINE_IID}"
    SERVICE_NAME: "${CI_PROJECT_NAME}"

deploy-pre:
  stage: deploy
  trigger:
    project: "iac/intaqalab/intaqalab-pre"
    branch: main
    strategy: depend
  needs:
    - job: version-rc
      artifacts: true
    - job: image-package-pre
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH == "preprod"
  variables:
