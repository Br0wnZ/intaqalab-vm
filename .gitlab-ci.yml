coverity-des:
  stage: security-tests
  image:
    name: registry.tools.inta.es/utils/coverity:2025.06.0
    entrypoint: [""]
  extends: .run-black-duck-tools
  tags: [k8s-tools]
  variables:
    BRIDGE_COVERITY_CONNECT_URL: $COVERITY_URL
    BRIDGE_COVERITY_CONNECT_USER_NAME: $COVERITY_USER
    BRIDGE_COVERITY_CONNECT_USER_PASSWORD: $COVERITY_PASSWORD
    BRIDGE_COVERITY_LOCAL: 'true'
    BRIDGE_COVERITY_INSTALL_DIRECTORY: "/opt/coverity"
    BRIDGE_COVERITY_CONNECT_PROJECT_NAME: $CI_PROJECT_NAME
    MARK_BUILD_STATUS: "success"
    BRIDGE_RUN_COMPONENTS: "coverity"
    BRIDGE_BLACKDUCKSCA_SCAN_FULL: "false"
    BRIDGE_BLACKDUCKSCA_FIXPR_ENABLED: "false"
    BRIDGE_BLACKDUCKSCA_REPORTS_SARIF_CREATE: "false"
    # BRIDGE_COVERITY_BUILD_COMMAND: "npm run build"
  before_script:
    - apt-get -o Acquire::Check-Valid-Until=false update && apt-get install -y --no-upgrade curl unzip ca-certificates gnupg
    - mkdir -p /etc/apt/keyrings
    - curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
    - echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" | tee /etc/apt/sources.list.d/nodesource.list
    - apt-get -o Acquire::Check-Valid-Until=false update && apt-get install -y nodejs
    - echo "=== Instalando dependencias npm ==="
    - npm ci --ignore-scripts --engine-strict=false
    - mkdir -p /opt/coverity/bin
    - cp "$COVERITY_LICENSE_FILE" /opt/coverity/bin/license.dat
    - export BRIDGE_BREAK="false"
    - env | grep BRIDGE_BREAK
    - |
      cat <<'EOF' > coverity.yaml
      capture:
        files:
          exclude-regex: '.*node_modules.*|.*[Ss]pec\.(ts|js)$|.*\.(mock|stub|fixture)\.(ts|js)$|.*__tests__.*|.*\.test\.(ts|js)$|.*coverage.*|.*dist.*|.*build.*|.*/\.codegraph/.*|.*tmp/.*|.*vitest\.config.*|.*karma\.conf.*|.*jest\.config.*|.*webpack.*|.*/\.github/.*|.*/\.gitlab/.*|.*/\.vscode/.*|.*/docs/.*|.*openwiki/.*|.*nginx\.conf|.*Dockerfile.*|.*\.(md|mdx)$|.*package-lock\.json$|.*pnpm-lock\.yaml$|.*\.eslintrc.*|.*prettier\.config.*|.*lint-staged.*|.*apis/.*\.(json|yaml)$'
      EOF
  rules:
    - if: ($CI_COMMIT_BRANCH == "develop") && $CI_PIPELINE_SOURCE != 'merge_request_event'
      variables:
        BRIDGE_COVERITY_CONNECT_STREAM_NAME: "$CI_PROJECT_NAME-$CI_COMMIT_BRANCH"
        BRIDGE_COVERITY_CONNECT_POLICY_VIEW: "Errores_Criticos_Pipeline"
    - if: ($CI_PIPELINE_SOURCE == 'merge_request_event') && $CI_COMMIT_BRANCH == "develop" 
      variables:
        BRIDGE_COVERITY_CONNECT_STREAM_NAME: "$CI_PROJECT_NAME-$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
        BRIDGE_COVERITY_AUTOMATION_PRCOMMENT: 'true'
        BRIDGE_GITLAB_USER_TOKEN: $GITLAB_USER_TOKEN
  artifacts:
    when: always
    paths:
      - .bridge
  allow_failure: true

