.node-upgrade:
  before_script:
    - apt-get update && apt-get install -y curl ca-certificates gnupg
    - mkdir -p /etc/apt/keyrings
    - curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
    - echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" | tee /etc/apt/sources.list.d/nodesource.list
    - apt-get update && apt-get install -y nodejs
    - export PATH=/usr/bin:$PATH
    - node -v && npm -v        

unit-test-des:
  stage: unit-tests
  image: registry.tools.inta.es/builders/node:22.22.3
  tags: [k8s-des]
  before_script:
    - git fetch origin develop --depth=1 
  script:
    - npm install --cache .npm --prefer-offline
    - npm run build:des
  cache:
      key: ${CI_COMMIT_REF_SLUG}
      paths:
      - dist/
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

unit-test-pre:
  stage: unit-tests
  image: registry.tools.inta.es/builders/node:22.22.3
  tags: [k8s-des]
  before_script:
    - git fetch origin preprod --depth=1  
  script:
    - npm install --cache .npm --prefer-offline
    - npm run build:pre
  cache:
      key: ${CI_COMMIT_REF_SLUG}
      paths:
      - dist/
  rules:
    - if: $CI_COMMIT_BRANCH == "preprod"

unit-test-pro:
  stage: unit-tests
  image: registry.tools.inta.es/builders/node:22.22.3
  tags: [k8s-des]
  before_script:
    - git fetch origin master --depth=1  
  script:
    - npm install --cache .npm --prefer-offline
    - npm run build:des
  cache:
      key: ${CI_COMMIT_REF_SLUG}
      paths:
      - dist/
  rules:
    - if: $CI_COMMIT_BRANCH == "master"    

build-des:
  stage: build
  tags: [k8s-des]
  image: registry.tools.inta.es/builders/node:22.22.3
  script:
    - npm ci --prefer-offline --no-audit --no-fund --ignore-scripts
    - npm run build -- --configuration des
  artifacts:
    paths:
      - dist/
    exclude:
      - dist/**/*.map
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"     

build-pre:
  stage: build
  tags: [k8s-des]    
  image: registry.tools.inta.es/builders/node:22.22.3
  script:
      - npm install --cache .npm --prefer-offline
      - npm run build -- --configuration pre
      - find dist/ -type f | head -30 || true
  artifacts:
      paths:
      - dist/
      expire_in: 1 hour
  cache:
      key: ${CI_COMMIT_REF_SLUG}
      paths:
      - .npm/  
  rules:
    - if: $CI_COMMIT_BRANCH == "preprod"     

build-pro:
  stage: build
  tags: [k8s-des]    
  image: registry.tools.inta.es/builders/node:22.22.3
  script:
      - npm install --cache .npm --prefer-offline
      - npm run build -- --configuration pro
      - find dist/ -type f | head -30 || true
  artifacts:
      paths:
      - dist/
      expire_in: 1 hour
  cache:
      key: ${CI_COMMIT_REF_SLUG}
      paths:
      - .npm/  
  rules:
    - if: $CI_COMMIT_BRANCH == "master"         

.kaniko-package-image-job:
  stage: compile
  image:
    name: ${KANIKO_IMAGE}
    entrypoint: [""]
  script:
    - > 
      echo "{\"auths\":{
        \"${INTA_REGISTRY_URL}\":{\"auth\":\"${INTA_REGISTRIES_CREDS}\"},
        \"${INTA_REGISTRY_BASE_URL}\":{\"auth\":\"${INTA_REGISTRIES_CREDS}\"},
        \"${INTA_REGISTRY_INT_URL}\":{\"auth\":\"${INTA_REGISTRIES_CREDS}\"}
      }}" > /kaniko/.docker/config.json
    
    - |
      FULL_IMAGE_PATH="${INTA_REGISTRY_INT_URL}/${INTA_REGISTRY_IMAGE_SUBPATH}"
      
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}" \
        --dockerfile "${CI_PROJECT_DIR}/Dockerfile" \
        --destination "${FULL_IMAGE_PATH}:${INTA_REGISTRY_IMAGE_TAG}" \
        --destination "${FULL_IMAGE_PATH}:latest" \
        --cache=false \
        --cleanup
      
      echo "Image built and pushed:"
      echo "  - ${FULL_IMAGE_PATH}:latest"
      echo "  - ${FULL_IMAGE_PATH}:${INTA_REGISTRY_IMAGE_TAG}"

image-package-des:
  environment: des
  tags: [k8s-des]  
  variables:
    ENV: "des"
    INTA_REGISTRY_IMAGE_TAG: "1.0.${CI_PIPELINE_IID}"
  extends: .kaniko-package-image-job
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

image-package-pre:
  environment: pre
  tags: [k8s-des]  
  variables:
    ENV: "pre"
    INTA_REGISTRY_IMAGE_TAG: "${VERSION}"
  extends: .kaniko-package-image-job
  needs:
    - job: version-rc
      artifacts: true
    - job: build-pre
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "preprod"  

image-package-pro:
  environment: pro
  tags: [k8s-des]  
  variables:
    ENV: "pro"
    INTA_REGISTRY_IMAGE_TAG: "${VERSION}"
  extends: .kaniko-package-image-job
  needs:
    - job: version-release
      artifacts: true
    - job: build-pro
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH == "master"      

deploy-des:
  stage: deploy
  trigger:
